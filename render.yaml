# Blueprint Render : « New + » → « Blueprint » → choisis ce dépôt.
# Render lit ce fichier et pose presque tout automatiquement.
services:
  - type: web
    name: otaku-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DISCORD_TOKEN
        sync: false        # à coller dans Render, jamais dans le dépôt
      - key: BOT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MONGODB_URI      # optionnel : base gratuite Atlas (réglages durables)
        sync: false
